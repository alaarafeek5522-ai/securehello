name: krinry Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options: [debug, release]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973"

      - name: Flutter pub get
        run: flutter pub get

      - name: Create android folder
        run: flutter create --platforms android .

      - name: Copy custom android files
        run: |
          cp android/app/build.gradle /tmp/build.gradle.bak
          cp -f android_override/app/build.gradle android/app/build.gradle || true
          mkdir -p android/app/src/main/cpp
          cp src/main/cpp/security.cpp android/app/src/main/cpp/ || true
          cp android/app/CMakeLists.txt android/app/CMakeLists.txt || true

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks

      - name: Build APK
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --${{ github.event.inputs.build_type }}

      - uses: actions/upload-artifact@v4
        with:
          name: secure-hello-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7
